<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页改造 Demo · B 方案 — 暗夜像素 × 月球叙事</title>
<style>
/* 缝合像素字体（与 Kimi 同款，OFL 许可，CDN 直链） */
@font-face {
  font-family: 'Fusion Pixel 12px Mono zh_hans';
  src: url('https://fusion-pixel-font.takwolf.com/fusion-pixel-12px-monospaced-zh_hans.otf.woff2') format('woff2');
  font-display: swap;
}

:root {
  /* Kimi 灰阶（本版主色板） */
  --px-black: #000;
  --px-surface: #151515;
  --px-border: #2a2a2a;
  --px-gray: #7a7a7a;
  --px-dim: #3e3e3e;
  --px-light: #f7f7f7;
  --px-white: #fff;
  /* 项目琥珀金 — 仅作点睛，不作主色 */
  --cs-accent: #d4a574;
  --font-pixel: 'Fusion Pixel 12px Mono zh_hans', ui-monospace, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--px-black); color: var(--px-light);
  font-family: var(--font-pixel);
  overflow-x: hidden;
}
::selection { background: var(--px-light); color: var(--px-black); }

.scanlines {
  pointer-events: none; position: fixed; inset: 0; z-index: 40;
  background: repeating-linear-gradient(0deg, transparent 0 3px, #00000014 3px 4px);
  mix-blend-mode: multiply;
}

/* ============ Boot 启动序列 ============ */
#boot {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; transition: opacity .5s steps(4);
}
#boot.done { opacity: 0; pointer-events: none; }
#boot .b-title { color: var(--px-light); font-size: 14px; letter-spacing: .3em; }
#boot .b-bar { width: 220px; height: 10px; border: 1px solid var(--px-gray); padding: 1px; }
#boot .b-fill { height: 100%; width: 0; background: var(--px-light); animation: load 1.3s steps(16) forwards; }
@keyframes load { to { width: 100%; } }
#boot .b-log { color: var(--px-gray); font-size: 11px; letter-spacing: .15em; height: 14px; }

/* ============ 顶部索引条 ============ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px clamp(20px, 6vw, 64px);
  font-size: 12px; letter-spacing: .18em; color: var(--px-gray);
  background: linear-gradient(#000d, transparent);
}
.topbar .brand { color: var(--px-light); }
.topbar .brand .px { color: var(--cs-accent); }

/* ============ Hero ============ */
.hero {
  position: relative; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 120px clamp(20px, 8vw, 110px) 90px; overflow: hidden;
}
#stars { position: absolute; inset: 0; image-rendering: pixelated; }

/* CSS 月球 — 靠右悬浮（Kimi bg-hero 同款意象） */
.moon {
  position: absolute; top: 50%; right: clamp(-60px, 2vw, 60px); transform: translateY(-52%);
  width: clamp(240px, 36vw, 460px); aspect-ratio: 1; border-radius: 50%;
  background:
    radial-gradient(circle at 38% 34%, #fff 0%, #e9e9e9 22%, #c9c9c9 45%, #8a8a8a 68%, #3e3e3e 88%, #151515 100%);
  box-shadow: 0 0 60px 10px #ffffff14, 0 0 160px 40px #ffffff0a, 0 0 320px 90px #ffffff06;
}
.moon::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background-image: radial-gradient(#0002 1px, transparent 1.5px), radial-gradient(#fff1 1px, transparent 1.5px);
  background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
  mix-blend-mode: multiply; opacity: .5;
}

/* 竖排装饰（Kimi 官网左侧「加入我们」） */
.vertical-text {
  position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
  writing-mode: vertical-rl; font-size: 13px; letter-spacing: 1.1em;
  color: var(--px-gray); opacity: .75; z-index: 2;
}

.content { position: relative; z-index: 5; max-width: 720px; }
.content a { pointer-events: auto; }

.tagline {
  font-size: 13px; letter-spacing: .28em; color: var(--px-gray); margin-bottom: 30px;
}
.tagline .blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 像素大标题 — 本版最大差异点：标题也用像素字体 */
.title {
  font-size: clamp(38px, 7.2vw, 84px); line-height: 1.3; font-weight: 400;
  color: var(--px-white);
}
.title .accent { color: var(--cs-accent); }
.title .ch {
  display: inline-block; opacity: 0; transform: translateY(14px);
  animation: chIn .5s steps(6) forwards;
}
@keyframes chIn { to { opacity: 1; transform: none; } }

.intro {
  margin-top: 34px; font-size: 14px; line-height: 2.1; color: var(--px-gray); max-width: 48ch;
}
.intro b { color: var(--px-light); font-weight: 400; }

/* 像素按钮 — 与 A 版同语言（硬阴影 + 按压位移） */
.actions { margin-top: 42px; display: flex; gap: 16px; flex-wrap: wrap; }
.btn-pixel {
  font-family: var(--font-pixel); font-size: 12px; letter-spacing: .18em;
  padding: 15px 28px; border: 1px solid var(--px-light);
  background: var(--px-light); color: #000;
  box-shadow: 4px 4px 0 var(--px-gray);
  cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 12px;
  transition: transform .1s steps(2), box-shadow .1s steps(2), background .15s, color .15s;
}
.btn-pixel:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--px-gray); }
.btn-pixel:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--px-gray); }
.btn-pixel.outline {
  background: transparent; color: var(--px-light);
  border-color: var(--px-gray); box-shadow: 4px 4px 0 #ffffff1a;
}
.btn-pixel.outline:hover { background: var(--px-light); color: #000; border-color: var(--px-light); }

/* 右上元数据 */
.meta-top {
  position: absolute; top: 128px; right: clamp(20px, 6vw, 64px); z-index: 5;
  text-align: right; font-size: 12px; letter-spacing: .2em; color: var(--px-gray);
}
.meta-top .season { color: var(--px-light); margin-bottom: 10px; }
.recruit {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--cs-accent); border: 1px solid #d4a57455; padding: 5px 12px;
}
.recruit .dot { width: 8px; height: 8px; background: var(--cs-accent); animation: pulse 1.4s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* 底部扫光滑动提示（Kimi 同款 mask 动画） */
.swipe-hint {
  position: absolute; bottom: clamp(22px, 4svh, 32px); left: 50%; transform: translateX(-50%);
  z-index: 5; text-align: center; width: max-content;
}
.swipe-hint .base { color: var(--px-gray); font-size: 14px; line-height: 24px; }
.swipe-hint .chev { width: 18px; height: 18px; margin: 0 auto 10px; }
.swipe-hint .shine {
  position: absolute; inset: 0; color: var(--px-white);
  mask-image: linear-gradient(transparent 0px, transparent 38%, #000 50%, transparent 62%, transparent 100%);
  mask-repeat: no-repeat; mask-size: 100% 116px;
  animation: swipeMask 1.8s linear infinite;
}
@keyframes swipeMask {
  from { mask-position: center 116px; }
  to   { mask-position: center -58px; }
}

/* 入场编排 */
.reveal { opacity: 0; }
.play .reveal { animation: wipe .6s steps(8) forwards; }
.play .reveal.d1 { animation-delay: .1s; }
.play .reveal.d3 { animation-delay: 1.3s; }
.play .reveal.d4 { animation-delay: 1.55s; }
@keyframes wipe { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

@media (max-width: 760px) {
  .moon { opacity: .4; right: -80px; }
  .vertical-text { display: none; }
}
</style>
</head>
<body>

<div class="scanlines"></div>

<div id="boot">
  <div class="b-title">COMPUTER ASSOCIATION · OS</div>
  <div class="b-bar"><div class="b-fill"></div></div>
  <div class="b-log" id="bootLog">booting…</div>
</div>

<header class="topbar">
  <div class="brand">Fztbu<span class="px">CS</span> · COMMUNITY</div>
  <div>[ 00 ] — INDEX</div>
</header>

<section class="hero" id="hero">
  <canvas id="stars"></canvas>
  <div class="moon"></div>
  <div class="vertical-text">加入我们 · JOIN US</div>

  <div class="meta-top">
    <div class="season">2026 / AUTUMN</div>
    <div class="recruit"><span class="dot"></span>RECRUITING</div>
  </div>

  <div class="content">
    <div class="tagline reveal d1">A COMMUNITY OF CODE, CURIOSITY &amp; CRAFT <span class="blink">▌</span></div>

    <h1 class="title" id="heroTitle"><span class="accent">探索</span>技术<br>的无限可能</h1>

    <p class="intro reveal d3">
      我们是校园中最纯粹的<b>技术社区</b>。在这里，代码不只是工具，
      <b>而是表达创意、解决问题、连接未来的语言。</b>
    </p>

    <div class="actions reveal d4">
      <a class="btn-pixel" href="#">立即加入 <span>→</span></a>
      <a class="btn-pixel outline" href="#">了解更多 <span>→</span></a>
    </div>
  </div>

  <div class="swipe-hint">
    <div class="base">
      <svg class="chev" viewBox="0 0 18 18" fill="none"><path d="M4 11l5-5 5 5" stroke="#7a7a7a" stroke-width="2"/></svg>
      滑动开启探索
    </div>
    <div class="shine" aria-hidden="true">
      <svg class="chev" viewBox="0 0 18 18" fill="none"><path d="M4 11l5-5 5 5" stroke="#fff" stroke-width="2"/></svg>
      滑动开启探索
    </div>
  </div>
</section>

<script>
/* Boot 序列 */
const boot = document.getElementById('boot');
const bootLog = document.getElementById('bootLog');
const logs = ['booting…','loading modules','rendering moon','ready'];
let li = 0;
const logTimer = setInterval(() => {
  li = Math.min(li + 1, logs.length - 1);
  bootLog.textContent = logs[li];
}, 340);
setTimeout(() => {
  clearInterval(logTimer);
  boot.classList.add('done');
  document.getElementById('hero').classList.add('play');
  startTitle();
}, 1400);

/* 星空 — 像素点闪烁 */
const cv = document.getElementById('stars');
const ctx = cv.getContext('2d');
let stars = [];
function resize() {
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;
  stars = Array.from({ length: Math.floor(cv.width * cv.height / 9000) }, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height,
    s: Math.random() < .85 ? 1 : 2,
    p: Math.random() * Math.PI * 2, v: .4 + Math.random() * 1.2,
  }));
}
resize();
addEventListener('resize', resize);
(function tick(t) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const st of stars) {
    const a = .25 + .55 * Math.abs(Math.sin(t / 1000 * st.v + st.p));
    ctx.fillStyle = `rgba(247,247,247,${a})`;
    ctx.fillRect(st.x | 0, st.y | 0, st.s, st.s);
  }
  requestAnimationFrame(tick);
})(0);

/* 标题逐字入场（保留强调色标记） */
function startTitle() {
  const title = document.getElementById('heroTitle');
  const html = title.innerHTML;
  title.innerHTML = '';
  // 逐段处理，保留 <span class="accent"> 与 <br>
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  let i = 0;
  function walk(node, parent) {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) {
        [...n.textContent].forEach((ch) => {
          const s = document.createElement('span');
          s.className = 'ch';
          s.style.animationDelay = (0.15 + i++ * 0.09) + 's';
          s.textContent = ch;
          parent.appendChild(s);
        });
      } else if (n.tagName === 'BR') {
        parent.appendChild(document.createElement('br'));
      } else {
        const wrap = document.createElement(n.tagName.toLowerCase());
        wrap.className = n.className;
        parent.appendChild(wrap);
        walk(n, wrap);
      }
    });
  }
  walk(tmp, title);
}
</script>
</body>
</html>
