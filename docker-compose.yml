# ============ FztbuCS-Project 全栈一键部署（方案②：根级编排）============
# 统一编排：外部 PostgreSQL + 外部 Redis + arq worker + FastAPI 后端 + Next.js 前端(BFF)
#
# 使用：
#   1. cp .env.example .env 并填写全部 CHANGE_ME 值
#   2. 确认服务器 PostgreSQL 已创建 DATABASE_NAME，并允许 Docker 容器访问
#   3. 确认服务器 Redis 已运行，并允许 Docker 容器访问
#   4. docker compose up -d --build
#   5. 前端默认绑定宿主机回环地址 http://127.0.0.1:2333
#      后续由部署者自行配置 HTTPS 反向代理指向该地址
#
# 架构：
#   - 前端(BFF) 通过内部网络 cs-net 把 /api 转发到 backend:8000
#   - backend/worker 通过 .env 中的 DATABASE_HOST 访问服务器已有 PostgreSQL 和 REDIS_URL 访问服务器已有 Redis
#   - 仅前端绑定宿主机回环地址 127.0.0.1:2333，后端不暴露宿主机端口
#   - 后端/前端 build.context 指向各自 submodule 目录，Dockerfile 内路径相对自身，无需改动

services:
  # ============ 后端 FastAPI（BFF 转发目标）============
  backend:
    build:
      context: ./CS-Web-Backend
    container_name: cs-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 连接服务器已有 PostgreSQL，不再使用 Compose 内 db 服务
      DATABASE_HOST: ${DATABASE_HOST:?请在 .env 中设置 DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?请在 .env 中设置 DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER:?请在 .env 中设置 DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?请在 .env 中设置 DATABASE_PASSWORD}
      # 外部 PostgreSQL 默认应已建库；保留开关供有权限的环境显式启用
      DB_AUTO_CREATE_DATABASE: ${DB_AUTO_CREATE_DATABASE:-false}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      SECRET_KEY: ${SECRET_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      PASSWORD_RESET_DEFAULT: ${PASSWORD_RESET_DEFAULT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      REQUIRE_REDIS_FOR_SECURITY: ${REQUIRE_REDIS_FOR_SECURITY:-true}
      # 跨实例事件广播（ADR-014）：MULTI_INSTANCE=true 经 arq/redis 广播事件。
      # 单实例部署保持 false（零开销，行为与改造前一致）。
      MULTI_INSTANCE: ${MULTI_INSTANCE:-false}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:?请在 .env 中设置 REDIS_URL}
    extra_hosts:
      # 服务器 PostgreSQL/Redis 监听宿主机时，可用 host.docker.internal 访问
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      - cs-net

  # ============ arq worker（跨实例事件广播落地 + 异步任务）============
  worker:
    build:
      context: ./CS-Web-Backend
    container_name: cs-worker
    restart: unless-stopped
    command: arq app.core.queue.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?请在 .env 中设置 DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?请在 .env 中设置 DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER:?请在 .env 中设置 DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?请在 .env 中设置 DATABASE_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MULTI_INSTANCE: ${MULTI_INSTANCE:-false}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:?请在 .env 中设置 REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cs-net

  # ============ 前端 Next.js（BFF）============
  cs-website:
    build:
      context: ./CS-Web-Frontend
      dockerfile: tools/deploy/Dockerfile
    container_name: cs-website
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2333
      # BFF 转发目标：容器内直连后端，无需暴露公网
      - BACKEND_URL=http://backend:8000
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # 纯 BFF：前端不持有任何数据库，移除 SQLite 挂载（原 SQLITE_DB_PATH 仅历史残留）
      # 默认不信任代理头；部署者配置外部反向代理后再显式设置为 true
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      # 持久化：用户上传文件等本地数据
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - cs-net
    depends_on:
      - backend
    ports:
      - "127.0.0.1:2333:2333"

networks:
  cs-net:
    driver: bridge
