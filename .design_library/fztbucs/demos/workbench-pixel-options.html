<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 像素融合三方案对照 Demo</title>
<style>
/* ===== Fusion Pixel 字体（与项目同款，本地 woff2） ===== */
@font-face {
  font-family: 'Fusion Pixel 12px Mono zh_hans';
  src: url('fusion-pixel-zh_hans.woff2') format('woff2');
  font-display: swap;
}

/* ===== 设计令牌（与 globals.css 一致，浅色 :root / 深色 .dark） ===== */
:root {
  --radius: 0.25rem;
  --background: #fdf5f7;
  --foreground: #1e1233;
  --card: #ffffff;
  --card-foreground: #1e1233;
  --primary: #1e40af;
  --primary-foreground: #ffffff;
  --muted-foreground: #6b5572;
  --destructive: oklch(0.577 0.245 27.325);
  --destructive-foreground: #ffffff;
  --border: rgba(30, 18, 51, 0.08);
  --font-pixel: 'Fusion Pixel 12px Mono zh_hans', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --ease-ark: cubic-bezier(0.22, 1, 0.36, 1);
}
.dark {
  --background: #000000;
  --foreground: #f5f5f4;
  --card: #0a0a0a;
  --card-foreground: #f5f5f4;
  --primary: #d4a574;
  --primary-foreground: #000000;
  --muted-foreground: #8a8a85;
  --destructive: oklch(0.577 0.245 27.325);
  --destructive-foreground: #ffffff;
  --border: rgba(255, 255, 255, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 32px 24px 80px;
  transition: background 0.3s, color 0.3s;
}

/* ===== 顶部说明条 ===== */
.demo-top { max-width: 1400px; margin: 0 auto 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.demo-top h1 { font-family: var(--font-serif); font-weight: 600; font-size: 26px; }
.demo-top p { color: var(--muted-foreground); font-size: 13px; line-height: 1.7; max-width: 720px; margin-top: 6px; }
.demo-top .meta-mono { font-family: var(--font-pixel); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
.theme-toggle {
  font-family: var(--font-pixel); font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
  padding: 8px 14px; background: transparent; color: var(--foreground);
  border: 1px solid var(--foreground); box-shadow: 3px 3px 0 var(--muted-foreground);
  cursor: pointer; transition: transform .1s steps(2), box-shadow .1s steps(2);
}
.theme-toggle:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--muted-foreground); }
.theme-toggle:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--muted-foreground); }

/* ===== 三栏对照网格 ===== */
.compare { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 28px; align-items: start; }
.panel { border: 1px solid var(--border); }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--foreground) 4%, var(--background)); }
.panel-head .tag { font-family: var(--font-pixel); font-size: 11px; letter-spacing: .14em; color: var(--primary); text-transform: uppercase; }
.panel-head .desc { font-size: 12px; color: var(--muted-foreground); margin-top: 6px; line-height: 1.6; }

/* ===== 工作台 mock 容器（pixel-page 包裹，与项目一致） ===== */
.wb { padding: 22px 20px 26px; }
.pixel-page .meta-mono { font-family: var(--font-pixel); }
.meta-mono { font-family: var(--font-pixel); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
.display-serif { font-family: var(--font-serif); }

/* 章节标记（SectionMarker 同款） */
.section-marker { font-family: var(--font-pixel); font-size: 11px; letter-spacing: .25em; color: var(--muted-foreground); text-transform: uppercase; margin-bottom: 14px; }

.wb-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.wb-title { font-family: var(--font-serif); font-weight: 600; font-size: clamp(26px, 4vw, 38px); line-height: 1.1; }
.wb-sub { margin-top: 8px; }
.wb-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* 像素按钮（与 globals.css .btn-pixel* 完全一致） */
.btn-pixel-sm, .btn-pixel-outline-sm, .btn-pixel-danger-sm {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .375rem .75rem; font-family: var(--font-pixel); font-size: 11px;
  text-transform: uppercase; letter-spacing: .18em; cursor: pointer;
  transition: transform .1s steps(2), box-shadow .1s steps(2), background .15s, color .15s;
}
.btn-pixel-sm { background: var(--foreground); color: var(--background); border: 1px solid var(--foreground); box-shadow: 3px 3px 0 var(--muted-foreground); }
.btn-pixel-sm:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--muted-foreground); }
.btn-pixel-outline-sm { background: transparent; color: var(--foreground); border: 1px solid var(--foreground); box-shadow: 3px 3px 0 var(--muted-foreground); }
.btn-pixel-outline-sm:hover { background: var(--foreground); color: var(--background); transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--muted-foreground); }
.btn-pixel-danger-sm { background: var(--destructive); color: var(--destructive-foreground); border: 1px solid var(--destructive); box-shadow: 3px 3px 0 color-mix(in srgb, var(--destructive) 35%, transparent); }
.btn-pixel-danger-sm:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 color-mix(in srgb, var(--destructive) 35%, transparent); }
.btn-pixel-danger-sm:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 color-mix(in srgb, var(--destructive) 35%, transparent); }

/* 盒装卡（card-minimal，方案 C 用，无硬阴影） */
.card-minimal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

/* DNA 卡（与 globals.css .dna-card 完全一致） */
.dna-card { position: relative; background: color-mix(in srgb, var(--foreground) 8%, var(--background)); border: 1px solid color-mix(in srgb, var(--foreground) 14%, var(--background)); padding: 26px 22px 22px; box-shadow: 4px 4px 0 color-mix(in srgb, var(--foreground) 10%, transparent); transition: transform 0.15s steps(3), box-shadow 0.15s steps(3), border-color 0.2s ease; }
.dna-card:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 color-mix(in srgb, var(--primary) 30%, transparent); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
.dna-card .dna-corner { position: absolute; top: 14px; right: 16px; font-family: var(--font-pixel); font-size: 11px; letter-spacing: .1em; color: var(--muted-foreground); transition: color 0.2s ease; }
.dna-card:hover .dna-corner { color: var(--primary); }
.dna-card .dna-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; font-family: var(--font-pixel); font-size: 11px; letter-spacing: .1em; margin-bottom: 12px; }
.dna-card .dna-meta .dna-tag { color: var(--primary); }
.dna-card .dna-meta .dna-dim { color: var(--muted-foreground); }
.wb-wtitle { font-family: var(--font-serif); font-weight: 500; font-size: 19px; margin-bottom: 14px; }

/* 问候条 */
.wb-greet { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 18px; }
.wb-greet-hi { font-family: var(--font-serif); font-size: clamp(20px, 3vw, 28px); }
.wb-greet .sep { width: 1px; height: 18px; background: var(--border); }

/* 栅格 */
.wb-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 520px) { .wb-grid { grid-template-columns: 1fr 1fr; } .wb-grid .wb-span2 { grid-column: 1 / -1; } }

/* 普通列表行（方案 B/C 用，保持原 workbench 行样式） */
.wb-rows { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.wb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; }
.wb-row .meta-mono { font-size: 10px; }
.wb-row.overdue { border-color: color-mix(in srgb, var(--destructive) 40%, transparent); background: color-mix(in srgb, var(--destructive) 6%, transparent); }
.wb-row.overdue .meta-mono { color: var(--destructive); }

/* 索引铁路列表（方案 A 用，与 globals.css .idx-rail 一致） */
.idx-rail { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.idx-rail > li { position: relative; display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--border); }
.idx-rail > li::before { content: ''; position: absolute; left: 19px; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--foreground) 14%, var(--background)); }
.idx-rail .idx { position: relative; z-index: 1; font-family: var(--font-pixel); font-size: 11px; letter-spacing: .1em; color: var(--muted-foreground); background: var(--background); padding: 2px 0; }
.idx-rail .idx-ttl { font-family: var(--font-serif); font-weight: 350; font-size: 16px; color: var(--foreground); line-height: 1.2; }
.idx-rail .idx-mt { font-family: var(--font-pixel); font-size: 10px; letter-spacing: .1em; color: var(--muted-foreground); margin-top: 6px; display: flex; gap: 12px; }
.idx-rail .idx-mt .k { color: var(--primary); }
.idx-rail .idx-arw { font-family: var(--font-mono, monospace); font-size: 15px; color: var(--muted-foreground); }
.idx-rail > li:hover .idx-ttl, .idx-rail > li:hover .idx, .idx-rail > li:hover .idx-arw { color: var(--primary); }

/* 倒计时块 */
.wb-count { font-family: var(--font-serif); font-size: 40px; line-height: 1; }
.wb-count .u { font-family: var(--font-pixel); font-size: 12px; color: var(--muted-foreground); margin-left: 6px; letter-spacing: .1em; }
.wb-chat { margin-top: 4px; height: 64px; border: 1px dashed var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 12px; }
</style>
</head>
<body>

<div class="demo-top">
  <div>
    <h1>工作台 · 像素融合三方案对照</h1>
    <p class="meta-mono">KIMI PIXEL × FZTBUCS EDITORIAL · WORKBENCH RESTYLE PREVIEW</p>
    <p>基于项目已落地的 <b>.pixel-page</b> / <b>.dna-card</b> / <b>.btn-pixel</b> 真实类与 Fusion Pixel 字体渲染。三方案均保留衬线标题与正文栈，仅元数据层与交互注入像素语言。悬停卡片可见硬阴影抬升。</p>
  </div>
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">切换 浅/深</button>
</div>

<div class="compare" id="compare"></div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  html.classList.toggle('dark');
}

const variants = [
  { key:'A', label:'A · 完整融合', desc:'pixel-page + DNA 卡（硬阴影/角标）+ 像素按钮 + SectionMarker，且任务列表改 idx-rail 索引铁路。最贴近 Kimi demo。', card:'dna-card', list:'idx' },
  { key:'B', label:'B · DNA 卡融合', desc:'pixel-page + DNA 卡 + 像素按钮 + SectionMarker；任务列表保持原行样式，仅像素化其元数据。', card:'dna-card', list:'plain' },
  { key:'C', label:'C · 仅元数据层', desc:'pixel-page + 像素按钮 + SectionMarker；widget 卡片仍用 card-minimal，不引入硬阴影。变化最小。', card:'card-minimal', list:'plain' },
];

function taskList(kind) {
  if (kind === 'idx') {
    return `<ul class="idx-rail">
      <li><span class="idx">01</span><div><div class="idx-ttl">昨天未完成的复习（逾期）</div><div class="idx-mt"><span class="k">OVERDUE</span><span>2026/08/17</span></div></div><span class="idx-arw">→</span></li>
      <li><span class="idx">02</span><div><div class="idx-ttl">今天要处理的练习题</div><div class="idx-mt"><span>TODAY</span><span>2026/08/18</span></div></div><span class="idx-arw">→</span></li>
      <li><span class="idx">03</span><div><div class="idx-ttl">明天的预习</div><div class="idx-mt"><span>TOMORROW</span><span>2026/08/19</span></div></div><span class="idx-arw">→</span></li>
    </ul>`;
  }
  return `<ul class="wb-rows">
    <li class="wb-row overdue"><span>昨天未完成的复习（逾期）</span><span class="meta-mono">OVERDUE</span></li>
    <li class="wb-row"><span>今天要处理的练习题</span><span class="meta-mono">TODAY</span></li>
    <li class="wb-row"><span>明天的预习</span><span class="meta-mono">TOMORROW</span></li>
  </ul>`;
}

function renderPanel(v) {
  const c = v.card;
  return `<section class="panel">
    <div class="panel-head">
      <div class="tag">${v.label}</div>
      <div class="desc">${v.desc}</div>
    </div>
    <div class="wb pixel-page">
      <div class="section-marker">[ 01 ] 工作台 / WORKBENCH</div>
      <div class="wb-head">
        <div>
          <div class="wb-title display-serif">工作台</div>
          <p class="meta-mono wb-sub">个人化信息聚合工作中心 · WORKSPACE</p>
        </div>
        <div class="wb-actions">
          <button class="btn-pixel-outline-sm">导出备份</button>
          <button class="btn-pixel-outline-sm">导入恢复</button>
          <button class="btn-pixel-danger-sm">清空</button>
          <button class="btn-pixel-outline-sm">布局设置</button>
        </div>
      </div>

      <div class="${c} wb-greet">
        <span class="wb-greet-hi display-serif">晚上好</span>
        <span class="sep"></span>
        <span class="meta-mono">2026/08/18 周二</span>
        <span class="meta-mono">14:32</span>
        <span class="meta-mono">在线 02:14</span>
      </div>

      <div class="wb-grid">
        <div class="${c} wb-span2">
          <span class="dna-corner">[AUX]</span>
          <div class="dna-meta"><span class="dna-tag">AUXILIO v1</span><span class="dna-dim">LLM</span></div>
          <h3 class="wb-wtitle">学习助手</h3>
          <div class="wb-chat">对话优先 · 用量与设置统一入口 ▌</div>
        </div>

        <div class="${c}">
          <span class="dna-corner">[TSK]</span>
          <div class="dna-meta"><span class="dna-tag">TODAY</span><span class="dna-dim">3</span></div>
          <h3 class="wb-wtitle">今日任务</h3>
          ${taskList(v.list)}
        </div>

        <div class="${c}">
          <span class="dna-corner">[EXM]</span>
          <div class="dna-meta"><span class="dna-tag">EXAM</span></div>
          <h3 class="wb-wtitle">考试倒计时</h3>
          <div class="wb-count">23<span class="u">DAYS</span></div>
          <p class="meta-mono" style="margin-top:8px">2026/09/10 开学考</p>
        </div>
      </div>
    </div>
  </section>`;
}

document.getElementById('compare').innerHTML = variants.map(renderPanel).join('');
</script>
</body>
</html>
