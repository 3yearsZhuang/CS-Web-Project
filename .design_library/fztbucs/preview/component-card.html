<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); }
    .row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-muted-foreground); padding-top: 12px; white-space: nowrap; }
    .card-wrap { flex: 1; min-width: 0; }
    .divider { border: none; height: 1px; background: var(--color-border); margin: 16px 0; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .card { width: 100%; background: var(--color-card); color: var(--color-card-foreground); border: 1px solid var(--color-border); border-radius: 0; transition: border-color .15s, background .15s; box-sizing: border-box; }
    .card:hover { border-color: var(--color-primary); background: linear-gradient(var(--color-hover-overlay), var(--color-hover-overlay)), var(--color-card); }
    .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--color-border); }
    .card-title { font-family: var(--font-serif); font-size: 18px; font-weight: 500; margin: 0 0 4px; line-height: 1.3; word-break: keep-all; overflow-wrap: break-word; }
    .card-meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted-foreground); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
    .card-body { padding: 1.25rem; font-size: 14px; line-height: 1.6; }
    .card-footer { padding: 0.75rem 1.25rem; border-top: 1px solid var(--color-border); display: flex; gap: 0.75rem; }
    .card-minimal { padding: 1rem 1.25rem; }
    .card-minimal .card-title { font-size: 16px; margin: 0 0 8px; }
    .card-minimal .card-body { padding: 0; font-size: 13px; color: var(--color-muted-foreground); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">Default</span>
    <div class="card-wrap">
      <article class="card">
        <header class="card-header">
          <h3 class="card-title">学术讲座</h3>
          <span class="card-meta">2026.03.15 · 14:00</span>
        </header>
        <div class="card-body">探索人工智能在社会科学研究中的前沿应用，主讲人将结合具体案例分析方法论革新。</div>
        <footer class="card-footer"><button class="btn-primary-sm">报名</button><button class="btn-outline-sm">详情</button></footer>
      </article>
    </div>
  </div>
  <div class="row">
    <span class="label">Body only</span>
    <div class="card-wrap">
      <article class="card">
        <div class="card-body">一份简洁的内容卡片，仅包含主体文本，适用于短提示、摘要或引用块。</div>
      </article>
    </div>
  </div>

  <hr class="divider">

  <div class="row">
    <span class="label">Minimal</span>
    <div class="card-wrap">
      <article class="card card-minimal">
        <h3 class="card-title">系统公告</h3>
        <div class="card-body">图书馆将于本周六进行系统维护，电子资源访问可能短暂中断。</div>
      </article>
    </div>
  </div>
  <div class="row">
    <span class="label">Hover</span>
    <div class="card-wrap">
      <article class="card card-minimal">
        <h3 class="card-title">可交互卡片</h3>
        <div class="card-body">悬停时边框切换为主色，并叠加极淡的悬停蒙层。</div>
      </article>
    </div>
  </div>
</body>
</html>
