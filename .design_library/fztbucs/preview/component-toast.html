<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); }
  .row { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--color-muted-foreground); text-transform: uppercase; padding-top: 14px; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 16px 0; }
  .toast-stack { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .toast { display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--color-card); color: var(--color-card-foreground); border: 1px solid var(--color-border); border-left: 3px solid var(--color-primary); border-radius: 0; font-family: var(--font-sans); font-size: 13px; line-height: 1.4; min-width: 240px; max-width: 360px; flex-shrink: 0; }
  .toast-success { border-left-color: var(--color-chart-3); }
  .toast-error { border-left-color: var(--color-destructive); }
  .toast-icon { flex-shrink: 0; width: 16px; height: 16px; color: var(--color-primary); }
  .toast-success .toast-icon { color: var(--color-chart-3); }
  .toast-error .toast-icon { color: var(--color-destructive); }
  .toast-message { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast-close { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; background: transparent; border: none; color: var(--color-muted-foreground); cursor: pointer; border-radius: 0; transition: background .15s, color .15s; }
  .toast-close:hover { background: var(--color-muted); color: var(--color-foreground); }
  .toast-close:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
  /* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v-4M12 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></symbol>
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></symbol>
</svg>
<div class="row">
  <span class="label">Default</span>
  <div class="toast" role="status">
    <svg class="toast-icon" width="16" height="16"><use href="#icon-info"/></svg>
    <span class="toast-message">新消息提醒</span>
    <button class="toast-close" aria-label="关闭"><svg width="16" height="16"><use href="#icon-x"/></svg></button>
  </div>
  <div class="toast toast-success" role="status">
    <svg class="toast-icon" width="16" height="16"><use href="#icon-check"/></svg>
    <span class="toast-message">保存成功</span>
    <button class="toast-close" aria-label="关闭"><svg width="16" height="16"><use href="#icon-x"/></svg></button>
  </div>
  <div class="toast toast-error" role="alert">
    <svg class="toast-icon" width="16" height="16"><use href="#icon-alert"/></svg>
    <span class="toast-message">保存失败，请重试</span>
    <button class="toast-close" aria-label="关闭"><svg width="16" height="16"><use href="#icon-x"/></svg></button>
  </div>
</div>
<hr class="divider">
<div class="row">
  <span class="label">Stack</span>
  <div class="toast-stack">
    <div class="toast" role="status">
      <svg class="toast-icon" width="16" height="16"><use href="#icon-info"/></svg>
      <span class="toast-message">处理中</span>
      <button class="toast-close" aria-label="关闭"><svg width="16" height="16"><use href="#icon-x"/></svg></button>
    </div>
    <div class="toast toast-success" role="status">
      <svg class="toast-icon" width="16" height="16"><use href="#icon-check"/></svg>
      <span class="toast-message">上传完成</span>
      <button class="toast-close" aria-label="关闭"><svg width="16" height="16"><use href="#icon-x"/></svg></button>
    </div>
    <div class="toast toast-error" role="alert">
      <svg class="toast-icon" width="16" height="16"><use href="#icon-alert"/></svg>
      <span class="toast-message">网络异常</span>
      <button class="toast-close" aria-label="关闭"><svg width="16" height="16"><use href="#icon-x"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
