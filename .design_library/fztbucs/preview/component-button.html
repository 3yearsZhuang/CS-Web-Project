<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Button</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--color-muted-foreground); text-transform: uppercase; min-width: 92px; flex-shrink: 0; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }
  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; border: none; cursor: pointer; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; border-radius: var(--radius-sm); min-width: auto; flex-shrink: 0; transition: background .15s, border-color .15s, filter .15s; }
  .btn-md { padding: 0.75rem 1.5rem; font-size: 12px; }
  .btn-sm { padding: 0.375rem 0.75rem; font-size: 11px; gap: 0.5rem; }
  .btn-primary { background: var(--color-primary); color: var(--color-primary-foreground); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: var(--color-destructive); color: var(--color-destructive-foreground); }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn-outline { background: transparent; color: var(--color-foreground); border: 1px solid var(--color-border); }
  .btn-outline:hover { background: var(--color-hover-overlay); }
  .btn:focus-visible { outline: 1px solid var(--color-primary); outline-offset: 2px; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ── 像素融合增量层 (Pixel Fusion) ── */
  .btn-pixel { display: inline-flex; align-items: center; gap: var(--px-gap); padding: 0.5rem 1rem; background: var(--c-pixel-paper); color: var(--c-pixel-ink); border: 1px solid var(--c-pixel-ink); box-shadow: var(--sh-px); font-family: var(--font-pixel); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; transition: transform .12s steps(2), box-shadow .12s steps(2); }
  .btn-pixel:hover, .btn-pixel:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }
  .btn-pixel:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-pixel--primary { background: var(--c-pixel-accent); color: var(--color-primary-foreground); border-color: var(--c-pixel-ink); }
  .btn-pixel--sm { padding: 0.25rem 0.6rem; font-size: 11px; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">Primary</span><button class="btn btn-md btn-primary">提交</button><button class="btn btn-sm btn-primary">提交</button></div>
  <div class="row"><span class="label">Outline</span><button class="btn btn-md btn-outline">取消</button><button class="btn btn-sm btn-outline">取消</button></div>
  <div class="row"><span class="label">Danger</span><button class="btn btn-md btn-danger">删除</button></div>
  <hr class="divider">
  <div class="row"><span class="label">Disabled</span><button class="btn btn-md btn-primary" disabled>已禁用</button><button class="btn btn-md btn-outline" disabled>已禁用</button></div>
  <div class="row"><span class="label">Loading</span><button class="btn btn-md btn-primary" disabled><span class="spinner" aria-hidden="true"></span>加载中</button></div>
  <hr class="divider">
  <div class="row"><span class="label">Pixel</span><button class="btn-pixel btn-pixel--primary">提交</button><button class="btn-pixel btn-pixel--sm">详情</button><button class="btn-pixel" disabled>已禁用</button></div>
</body>
</html>
